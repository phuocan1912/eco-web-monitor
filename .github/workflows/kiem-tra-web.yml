name: Kiểm tra website

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Chỉ gửi tin nhắn thử vào Telegram'
        type: boolean
        default: false

concurrency:
  group: kiem-tra-web
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/cache/restore@v6
        with:
          path: state
          key: trang-thai-${{ github.run_id }}
          restore-keys: trang-thai-

      - run: npm install playwright
      - run: npx playwright install --with-deps chromium

      - run: node check.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.send_test }}

      - uses: actions/cache/save@v6
        if: always() && hashFiles('state/status.txt') != ''
        with:
          path: state
          key: trang-thai-${{ github.run_id }}
